name: Análise Técnica Diária

on:
  schedule:
    # Roda de segunda a sexta, às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  run-analise:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        # Inclui as bibliotecas matemáticas e o requests para envio ao Telegram
        run: pip install yfinance pandas-ta pandas requests

      - name: Rodar o script de análise
        env:
          # Reaproveitamos os mesmos secrets que você já criou para o bot de notícias
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analise_ticket.py
